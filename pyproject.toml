[project]
name = "ko-pron-check"
version = "0.1.0"
description = "Check Korean TTS audio against its script by standard pronunciation, not spelling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
transcribe = ["mlx-whisper"]

[project.scripts]
kopron = "kopron.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kopron"]
